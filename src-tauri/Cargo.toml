[package]
name = "ytmusic-redux"
version = "2.3.0"
description = "YTMusic Redux: a fast YouTube Music desktop client built with Tauri and Rust"
authors = ["Mirang Bhandari", "YTMusic Redux contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "ytmusic_redux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png", "devtools"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "macros", "rt-multi-thread"] }
axum = "0.8"
socketioxide = { version = "0.18", features = ["extensions"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
notify = "8"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri's WebView2 backend already uses, for the memory target level API.
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
] }

# Small, fast binary: the UI runs in WebView2, so Rust code size matters more than peak
# throughput. Panics still unwind so a failing background task cannot take the app down.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
